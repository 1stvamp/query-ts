[project]
name = "query-ts"
version = "0.1.0"
description = "CLI for querying the Tailscale API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["tailscale", "cli", "networking"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.scripts]
query-ts = "query_ts.cli:main"

[project.urls]
Repository = "https://github.com/1stvamp/query-ts"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/query_ts"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/query_ts"]
branch = true

[tool.coverage.report]
show_missing = true
