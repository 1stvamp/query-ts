name: Homebrew

on:
  push:
    tags: ["v*"]

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Bump formula in tap
        uses: mislav/bump-homebrew-formula-action@v3
        with:
          formula-name: query-ts
          homebrew-tap: 1stvamp/homebrew-tap
          download-url: https://codeload.github.com/1stvamp/query-ts/tar.gz/refs/tags/${{ github.ref_name }}
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
